description: 'Push Doctor is a UK telehealth company offering video consultations with licensed UK GPs
  via smartphone, describing itself as the UK''s first platform to provide video doctor consultations
  on mobile. It serves both NHS patients and private paying customers, covering online GP appointments,
  digital prescriptions, referrals and follow-up care. Headquartered in Manchester and backed by Partech,
